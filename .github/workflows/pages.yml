name: Publish site (GitHub Pages)

# Builds the MkDocs site and pushes it to the gh-pages branch.
# One-time setting if the site does not appear: repo Settings -> Pages ->
# "Deploy from a branch" -> gh-pages / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.5.44 pymdown-extensions==10.12
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: mkdocs gh-deploy --force --strict
