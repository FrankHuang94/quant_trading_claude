config:
  default: true
  MD003: { style: atx }
  MD004: false          # list marker style
  MD007: false          # list indentation (details blocks, nested lists)
  MD013: false          # line length
  MD024: { siblings_only: true }
  MD026: false          # trailing punctuation in headings (questions are headings)
  MD029: false          # ordered list prefix
  MD033: false          # inline HTML (<details>, <summary>, <br>)
  MD036: false          # emphasis used instead of heading
  MD046: { style: fenced }
  MD049: false
  MD050: false
  MD059: false          # descriptive link text
  MD060: false          # table column style
ignores:
  - "node_modules/**"
  - "BUILD_SPEC.md"
  - "site/**"
